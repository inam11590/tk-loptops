<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" fill="none">
  <defs>
    <radialGradient id="hero-glow" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#2563EB" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0B1220" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lid-frame" x1="180" y1="90" x2="780" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="oled-display" x1="200" y1="110" x2="760" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="38%" stop-color="#1E3A8A"/>
      <stop offset="75%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="deck-metal" x1="80" y1="490" x2="880" y2="555" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>

  <!-- Ambient Backlight -->
  <ellipse cx="480" cy="340" rx="420" ry="290" fill="url(#hero-glow)"/>
  <ellipse cx="480" cy="575" rx="370" ry="28" fill="#030712" fill-opacity="0.65"/>

  <!-- Outer CNC Aluminum Lid -->
  <rect x="176" y="92" width="608" height="402" rx="24" fill="url(#lid-frame)" stroke="#60A5FA" stroke-opacity="0.45" stroke-width="3"/>

  <!-- InfinityEdge OLED Screen -->
  <rect x="196" y="112" width="568" height="362" rx="12" fill="url(#oled-display)"/>

  <!-- Dynamic Wallpaper Ribbons -->
  <path d="M196 360 C310 250, 440 430, 580 260 C650 180, 720 220, 764 175 L764 474 L196 474 Z" fill="#60A5FA" fill-opacity="0.22"/>
  <path d="M196 410 C340 310, 490 450, 640 310 C700 255, 735 280, 764 250 L764 474 L196 474 Z" fill="#38BDF8" fill-opacity="0.18"/>

  <!-- On-Screen Performance HUD Widget -->
  <rect x="236" y="152" width="230" height="124" rx="14" fill="#0B1220" fill-opacity="0.68" stroke="#60A5FA" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="256" y="182" fill="#93C5FD" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">INTEL CORE ULTRA 9</text>
  <text x="256" y="210" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="22" font-weight="800">240Hz OLED</text>
  <rect x="256" y="228" width="170" height="8" rx="4" fill="#1E293B"/>
  <rect x="256" y="228" width="142" height="8" rx="4" fill="#38BDF8"/>
  <text x="256" y="256" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="11" font-weight="500">RTX 4070 8GB • 32GB LPDDR5x</text>

  <!-- Right Screen Floating Graphic Circle -->
  <circle cx="620" cy="275" r="74" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2" fill="#FFFFFF" fill-opacity="0.06"/>
  <circle cx="620" cy="275" r="52" stroke="#38BDF8" stroke-opacity="0.7" stroke-width="2.5" fill="#2563EB" fill-opacity="0.22"/>
  <text x="620" y="283" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="800" font-size="24" letter-spacing="1.5">TK PRO</text>

  <!-- Webcam & IR Sensor -->
  <circle cx="480" cy="102" r="3.5" fill="#38BDF8"/>

  <!-- Laptop Base / Keyboard Deck -->
  <path d="M96 494H864L902 532C902 544 890 552 872 552H88C70 552 58 544 58 532L96 494Z" fill="url(#deck-metal)"/>
  <path d="M96 494H864L874 505H86L96 494Z" fill="#475569"/>
  <!-- RGB Underglow Accent Strip -->
  <rect x="160" y="548" width="640" height="4" rx="2" fill="#3B82F6"/>
  <!-- Precision Notch -->
  <rect x="410" y="494" width="140" height="9" rx="4.5" fill="#1E293B"/>
</svg>
