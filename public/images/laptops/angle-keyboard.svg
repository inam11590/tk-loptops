<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bg-angle-kb" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg-angle-kb)"/>
  <rect x="130" y="90" width="540" height="420" rx="24" fill="#334155" stroke="#64748B" stroke-width="3"/>
  <!-- Top Speaker Grille -->
  <rect x="170" y="118" width="460" height="16" rx="8" fill="#1E293B"/>
  <!-- Backlit Keyboard Matrix -->
  <rect x="165" y="152" width="470" height="205" rx="12" fill="#0B1220" stroke="#3B82F6" stroke-opacity="0.45" stroke-width="2"/>
  <g fill="#1E293B" stroke="#60A5FA" stroke-opacity="0.4" stroke-width="1">
    <rect x="180" y="168" width="440" height="24" rx="4"/>
    <rect x="180" y="200" width="440" height="30" rx="4"/>
    <rect x="180" y="238" width="440" height="30" rx="4"/>
    <rect x="180" y="276" width="440" height="30" rx="4"/>
    <rect x="180" y="314" width="130" height="28" rx="4"/>
    <rect x="320" y="314" width="160" height="28" rx="4" fill="#2563EB" fill-opacity="0.25"/>
    <rect x="490" y="314" width="130" height="28" rx="4"/>
  </g>
  <!-- Haptic Glass Touchpad -->
  <rect x="290" y="376" width="220" height="112" rx="12" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
  <text x="400" y="548" text-anchor="middle" fill="#94A3B8" font-family="system-ui, sans-serif" font-weight="600" font-size="16" letter-spacing="2">BACKLIT KEYBOARD &amp; HAPTIC TOUCHPAD</text>
</svg>
